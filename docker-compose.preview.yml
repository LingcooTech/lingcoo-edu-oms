name: lingcoo-edu-oms-preview

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: lingcoo_edu_oms_preview
      POSTGRES_USER: oms_preview
      POSTGRES_PASSWORD: local-preview-only-password
    ports:
      - '127.0.0.1:55439:5432'
    volumes:
      - preview_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U oms_preview -d lingcoo_edu_oms_preview']
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  preview_postgres_data:
